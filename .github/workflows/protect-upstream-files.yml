name: Protect upstream files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if any upstream-owned path was edited
        run: bash extensions/scripts/check-upstream-untouched.sh
